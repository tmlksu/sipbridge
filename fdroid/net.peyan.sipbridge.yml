# F-Droid 収録メタデータ (fdroiddata へ提出する雛形)。
#
# 提出先: https://gitlab.com/fdroid/fdroiddata の metadata/net.peyan.sipbridge.yml
# 手元で検証する場合:
#   git clone https://gitlab.com/fdroid/fdroiddata && cd fdroiddata
#   cp <this file> metadata/net.peyan.sipbridge.yml
#   fdroid lint net.peyan.sipbridge
#   fdroid build -v -l net.peyan.sipbridge     # Docker/VM が要る

Categories:
  - Phone & SMS
  - Internet
License: Apache-2.0
AuthorName: tmlksu
SourceCode: https://github.com/tmlksu/sipbridge
IssueTracker: https://github.com/tmlksu/sipbridge/issues

AutoName: SIP Bridge

RepoType: git
Repo: https://github.com/tmlksu/sipbridge.git

Builds:
  - versionName: '1.2'
    versionCode: 3
    commit: v1.2
    # gradle のルートは android/。ビルドするモジュールは android/app。
    subdir: android/app
    # foss フレーバーのみをビルドする。gms (Firebase/FCM) はビルドしない。
    gradle:
      - foss

# 収録後のバージョン追従: git タグ (v1.2, v1.3, ...) を見る。
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: '1.2'
CurrentVersionCode: 3

# --- レビューで聞かれそうな点のメモ (提出時は削って構わない) ---
#
# 1. 依存はすべて Apache-2.0。foss フレーバーの実行時依存に
#    Firebase / Google Play services は一切入らない (検証済み)。
#    build.gradle には gmsImplementation で firebase-messaging の記述があるが、
#    これは gms フレーバー専用で foss のビルドには含まれない。
#    scanner がこの記述を拾って警告する場合は、この build に
#    `scanignore: android/app/build.gradle` を足すか、
#    フレーバー限定であることを説明する。
#
# 2. AntiFeatures は付かないと考えている。relay (このアプリの接続先) は
#    同じリポジトリの Apache-2.0 な Go プログラムで、利用者が自分で動かす。
#    特定事業者のサービスに依存しない (Cloudflare Tunnel は推奨構成の一例で、
#    必須ではない。relay は AUTH_MODE=token で単独でも動く)。
#
# 3. push 通知は foss フレーバーには無い。常駐 (フォアグラウンドサービス) で
#    WebSocket を張り続ける運用が前提。full_description に明記済み。
