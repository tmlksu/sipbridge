; sipbridge 結合テスト用 pjsip.conf (T2)。
; 内線 101 = relay (sipbackend)、102 = テスト発呼側。
; パスワードはテスト専用ダミー (本番とは無関係)。
; integration_test.go の既定値と一致させること。

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[101]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
auth=101-auth
aors=101
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[101-auth]
type=auth
auth_type=userpass
username=101
password=test101pass

[101]
type=aor
max_contacts=1
remove_existing=yes

[102]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
auth=102-auth
aors=102
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[102-auth]
type=auth
auth_type=userpass
username=102
password=test102pass

[102]
type=aor
max_contacts=1
remove_existing=yes
