; sipbridge 結合テスト用 extensions.conf (T2 / T7)。
; 101 = relay 着信、102 = relay の 2 つ目のアカウント (T7 マルチアカウント)、
; *43 = エコーテスト (Dial 発信の戻り確認用)。

[internal]
exten => 101,1,NoOp(Incoming to relay 101)
 same => n,Dial(PJSIP/101,25)
 same => n,Hangup()

; T7: 同一 relay プロセス内の 101 → 102 発信で使う。
exten => 102,1,NoOp(Incoming to 102)
 same => n,Dial(PJSIP/102,25)
 same => n,Hangup()

exten => *43,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
