# sipbridge 用 compose 定義。deploy/ ディレクトリで操作すること:
#   cp .env.example .env   # 編集して値を入れる
#   docker compose config  # 検証
#   docker compose up -d --build
#
# relay と cloudflared はどちらも network_mode: host。
# 理由: relay が RTP 用 UDP ポート範囲 (RTP_PORT_MIN..MAX) を使うため、
# ポートマッピングより host モードが素直。relay 自身は LISTEN
# (既定 127.0.0.1:8080) のみで待ち受け、外部公開は cloudflared 経由のみ。
# host モードでは各プロセスの待ち受けがそのまま LAN に出るため、cloudflared の
# metrics (/metrics /config /debug/pprof) も 127.0.0.1 に限定する (#37)。
#
# 両サービスとも read_only / cap_drop: ALL / no-new-privileges で動かす。
# relay が書くのは bind mount した ./data (状態ファイル) だけ。
# セキュリティモデル全体は docs/SECURITY.md。

name: sipbridge

services:
  relay:
    build:
      context: ../relay
      dockerfile: ../deploy/Dockerfile
    image: sipbridge-relay:latest
    container_name: sipbridge-relay
    network_mode: host
    env_file:
      - path: .env
        required: false # .env 無しでも `docker compose config` が通るように (本番は .env を置くこと)
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 状態ファイル (push トークン) と FCM サービスアカウントの置き場。
    # network_mode: host でもファイルシステムはコンテナ内なので bind mount が必要。
    # 事前に: mkdir -p data && sudo chown 65532:65532 data (relay は UID 65532 で動く)
    volumes:
      - ./data:/var/lib/sipbridge
    # scratch ベース (curl 無し) のため relay 自身のサブコマンドで判定する。
    # 前提 (T1): `relay healthcheck` が LISTEN 先の /healthz を叩き、
    # 200 なら exit 0、そうでなければ非ゼロで終了する。
    healthcheck:
      test: ["CMD", "/relay", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    # バージョンは固定する (latest は意図しない更新・供給網リスクがある)。
    # 更新手順は docs/SECURITY.md「cloudflared の更新」。
    image: cloudflare/cloudflared:2026.9.3
    container_name: sipbridge-cloudflared
    network_mode: host
    # トークンは argv ではなく環境変数 TUNNEL_TOKEN で渡す (cloudflared が読む)。
    # argv だとホストの ps / /proc/<pid>/cmdline から誰でも読めるため。
    # 値は deploy/.env から compose が展開する。
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    # --metrics を明示しないと host ネットワークの全インタフェースで metrics
    # サーバ (/metrics /config /debug/pprof) が開き LAN から見える。
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
